auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096   # Tempo uses the default 9095 in the same container

common:
  instance_addr: 127.0.0.1
  path_prefix: /var/lib/monitoring/loki
  storage:
    filesystem:
      chunks_directory: /var/lib/monitoring/loki/chunks
      rules_directory: /var/lib/monitoring/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
