global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # auth-service in Azure Container Apps: internal app, plain HTTP, reached by app name.
  # (No port: Azure routes http://auth-service to the app's port 8000.)
  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service"]
        labels:
          service: auth-service
