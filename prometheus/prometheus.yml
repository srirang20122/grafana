global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # monitor-system backend in Azure Container Apps (HTTPS on 443, reached by app name)
  - job_name: backend
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["monitor-system:443"]
